{% extends 'base.html' %}

{% block title %}{{ category.name }}{% endblock %}

{% block content %}
    <h2>{{ category.name }}</h2>
    <p>{{ category.description }}</p>
    
    <div class="grid">
        {% for service in services %}
            <div class="card">
                <h3>{{ service.name }}</h3>
                <p>{{ service.price }} руб.</p>
                <a href="{% url 'services:service_detail' service.id %}">Подробнее</a>
            </div>
        {% endfor %}
    </div>
{% endblock %}
