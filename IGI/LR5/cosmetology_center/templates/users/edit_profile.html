{% extends 'base.html' %}

{% block title %}Редактирование профиля{% endblock %}

{% block content %}
    <h2>Редактирование профиля</h2>
    
    <div class="card">
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn">Сохранить</button>
            <a href="{% url 'users:profile' %}" class="btn">Отмена</a>
        </form>
    </div>
{% endblock %}
